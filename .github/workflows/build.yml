name: Build Windows Application

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Clean Stale Builds
        run: |
          if (Test-Path dist) { Remove-Item -Recurse -Force dist }
          if (Test-Path src-tauri/target/release/bundle/nsis) { Remove-Item -Recurse -Force src-tauri/target/release/bundle/nsis }
        shell: pwsh

      - name: Build frontend and Tauri application
        run: npm run tauri build

      - name: Set Variables for Provenance
        id: vars
        run: |
          $shortSha = "${{ github.sha }}".Substring(0, 7)
          echo "SHORT_SHA=$shortSha" >> $env:GITHUB_ENV
          echo "ARTIFACT_NAME=LYK-Launcher-Windows-$shortSha-${{ github.run_number }}" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Generate Build Provenance Manifest
        run: |
          echo "Commit SHA: ${{ github.sha }}" > build-manifest.txt
          echo "Short SHA: ${{ env.SHORT_SHA }}" >> build-manifest.txt
          echo "Branch/Ref: ${{ github.ref }}" >> build-manifest.txt
          echo "Run Number: ${{ github.run_number }}" >> build-manifest.txt
          echo "Target Platform: x86_64-pc-windows-msvc" >> build-manifest.txt
          echo "Timestamp: $(Get-Date -Format s)" >> build-manifest.txt
        shell: pwsh

      - name: Verify Artifact Exists
        run: |
          if (-not (Test-Path src-tauri/target/release/bundle/nsis/*.exe)) {
            Write-Error "Windows installer (.exe) not found!"
            exit 1
          }
        shell: pwsh

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            build-manifest.txt
